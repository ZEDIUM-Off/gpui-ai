[package]
name = "gallery"
description = "Component gallery for gpui-ai — one story per component."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "gallery"

[[bin]]
name = "gallery-performance"
path = "src/performance_main.rs"
required-features = ["performance"]

[[bin]]
name = "gallery-catalog-scan"
path = "src/catalog_main.rs"
required-features = ["performance"]

[[bin]]
name = "gallery-catalog-export"
path = "src/catalog_export_main.rs"
required-features = ["export"]

[features]
default = ["syntax"]
# Tree-sitter grammars for the CodeBlock stories. A host that links another
# tree-sitter, such as Zedbench, turns this off: only one crate may link the
# native library, and TextView falls back to its line highlighter.
syntax = [
    "gpui-component/tree-sitter-rust",
    "gpui-component/tree-sitter-typescript",
    "gpui-component/tree-sitter-tsx",
    "gpui-component/tree-sitter-python",
    "gpui-component/tree-sitter-markdown",
    "gpui-component/tree-sitter-bash",
    "gpui-component/tree-sitter-css",
    "gpui-component/tree-sitter-html",
]
performance = ["gpui/profiler", "dep:windows-sys"]
# Kept behind a feature so serde_json stays out of the shipped gallery and its
# WASM build; only the catalog exporter needs it.
export = ["dep:serde_json"]

[dependencies]
anyhow.workspace = true
gpui.workspace = true
# Already in the tree through gpui; named here because the decoration
# stories read pixels rather than just handing bytes to an <img>.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-ai.workspace = true
gpui-base.workspace = true
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[build-dependencies]
serde_json = "1"
